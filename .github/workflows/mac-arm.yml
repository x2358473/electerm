# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: mac-arm

on:
  push:
    branches: [ build, test, build-only, mac-arm ]
  workflow_dispatch:

jobs:
  build:

    permissions:
      contents: write
    runs-on: macos-15
    environment: build
    if: ${{ !contains(github.event.head_commit.message, '[skip build]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip mac]') && !contains(github.event.head_commit.message, '[skip arm]') }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    # before_install:
    - run: pip install setuptools
    - run: npm config set legacy-peer-deps true
    - run: npm install -g yarn
    - run: npm i

    - name: Install R2 dependencies if needed
      if: ${{ contains(github.event.head_commit.message, '[r2]') }}
      run: npm i -D @aws-sdk/client-s3

    # script:
    - run: npm run b
    
    - name: Run pb
      run: npm run pb

    # Self-use build: without an Apple certificate notarization fails. Patch
    # only the copied root config, src/build/electron-builder.json is untouched
    # so official releases keep signing.
    - name: Disable code signing for this unsigned build
      run: |
        node -e '
          const fs = require("fs")
          const p = "electron-builder.json"
          const j = JSON.parse(fs.readFileSync(p, "utf8"))
          j.mac.notarize = false
          j.mac.hardenedRuntime = false
          j.mac.identity = null
          fs.writeFileSync(p, JSON.stringify(j, null, 2))
        '

    - name: build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLEID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLEIDPASS }}
        APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
        CSC_IDENTITY_AUTO_DISCOVERY: false
        WORKFLOW_NAME: ${{ github.workflow }}
        CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
        CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node src/build/bin/build-mac-arm

    - name: Upload dmg
      uses: actions/upload-artifact@v4
      with:
        name: electerm-mac-arm64
        path: dist/*.dmg
        if-no-files-found: error

    - name: Publish to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(node -p "require('./package.json').version")
        TAG="v$VERSION"
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "electerm v$VERSION (unsigned macOS arm64 build)"
        fi
        gh release upload "$TAG" dist/*.dmg --clobber

